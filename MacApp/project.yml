name: LocalTranslateBridge
options:
  bundleIdPrefix: com.malusama
  deploymentTarget:
    macOS: "26.4"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.4"
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  LocalTranslateBridge:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - project.yml
          - App.entitlements
          - Info.plist
          - LocalTranslateBridge.xcodeproj
      - path: ../Sources/TranslationProcessor.swift
      - path: ../index.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malusama.LocalTranslateBridge
        PRODUCT_NAME: LocalTranslateBridge
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 malusama"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: 本地翻译桥
        CFBundleName: LocalTranslateBridge
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 malusama"
    scheme:
      testTargets: []
      gatherCoverageData: false
